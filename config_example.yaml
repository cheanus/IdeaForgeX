# ── LLM ──
llm_base_url: "http://localhost:8000/v1"
llm_api_key: ""
llm_model_name: "gpt-4o-mini"
llm_json_mode: true         # false=不传 response_format，兼容不支持 JSON 模式的 LLM
llm_thinking_enabled: true  # true=添加 extra_body 思考模式
temperature_llm_a_judge: 0.1
max_retries: 3

# ── Embedding ──
embedding_base_url: "http://localhost:8000/v1"
embedding_api_key: ""
embedding_model_name: "text-embedding-3-small"
embedding_dim: 1536

# ── 论文源 ──
aminer_api_key: ""
aminer_base_url: "https://datacenter.aminer.cn/gateway/open_platform"
arxiv_api_url: "https://export.arxiv.org/api/query"
arxiv_short_abstract_threshold: 200  # 摘要低于此字符数时触发全文 PDF 降级

# ── Neo4j ──
neo4j_uri: "bolt://localhost:7688"
neo4j_user: "neo4j"
neo4j_password: ""
neo4j_database: "neo4j"

# ── 检索 ──
k_hits: 10          # 向量搜索 top-k
max_neighbors: 3    # 每节点扩展上限
max_depth: 2        # hop 展开层数
score_decay: 0.7    # 分数衰减因子
final_k: 20         # 最终返回候选数

# ── 日志 ──
log_level: "WARNING"  # DEBUG | INFO | WARNING | ERROR
