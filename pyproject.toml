[project]
name = "ideaforgex"
version = "0.1.0"
description = "AI 论文创新点知识图谱系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "langgraph>=0.3.0",
    "neo4j>=5.0.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
    "pymupdf>=1.24.0",
    "typing-extensions>=4.0.0",
    "openalex-official>=0.3.3",
    "tqdm>=4.67.3",
    "numpy>=2.4.6",
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
]

[project.scripts]
ifx = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=8.0.0",
]

[tool.uv]
package = true
